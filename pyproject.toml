[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echofit"
version = "0.1.0"
description = "Bayesian modelling of AGN reverberation-mapping light curves as a delayed echo of a driving light curve"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "echofit contributors" }]
keywords = ["AGN", "reverberation mapping", "Bayesian inference", "NumPyro", "astrophysics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # Capped, not just floored: an unconstrained jax/jaxlib range can
    # resolve to a version with no published wheel for a given platform
    # (hit this directly with `poetry install` resolving to jaxlib 0.10.2,
    # which has no compatible wheel on this machine) -- 0.4.x is the line
    # this codebase is developed and tested against.
    "jax>=0.4.28,<0.5",
    "jaxlib>=0.4.28,<0.5",
    "numpyro>=0.15.0",
    "numpy>=1.24",
    "matplotlib>=3.7",
    "arviz>=0.17",
    "h5netcdf>=1.0",
    "h5py>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "jupyter", "ipykernel"]

[project.urls]
Homepage = "https://github.com/drds1/echofit"

[tool.setuptools.packages.find]
include = ["echofit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
